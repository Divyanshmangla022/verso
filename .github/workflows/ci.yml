name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build and API tests
    runs-on: ubuntu-24.04
    env:
      # Pin the mongod the tests download so the cache key is meaningful.
      MONGOMS_VERSION: 8.2.6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Cache the mongod binary used by the test suite
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-${{ runner.os }}-${{ env.MONGOMS_VERSION }}

      - run: npm ci

      - name: Typecheck every workspace
        run: npm run typecheck

      - name: Build the web app
        run: npm run build

      - name: API and regression tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  qa:
    name: Browser end-to-end run
    runs-on: ubuntu-24.04
    env:
      MONGOMS_VERSION: 8.2.6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Cache the mongod binary used by the QA run
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-${{ runner.os }}-${{ env.MONGOMS_VERSION }}

      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium

      # No API key: the AI layer runs in its labelled heuristic mode, so the run
      # is free and deterministic.
      - name: Drive the real UI as two users
        run: npm run qa -- --no-screenshots
        env:
          GEMINI_API_KEY: ''
