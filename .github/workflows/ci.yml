name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build and API tests
    runs-on: ubuntu-24.04
    env:
      # Pin the mongod the tests download so the cache key is meaningful.
      MONGOMS_VERSION: 8.2.6
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Cache the mongod binary used by the test suite
        uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-${{ runner.os }}-${{ env.MONGOMS_VERSION }}

      - run: npm ci

      - name: Typecheck every workspace
        run: npm run typecheck

      - name: Build the web app
        run: npm run build

      - name: API and regression tests
        run: npm test

      # A real finding fails the build. A registry outage does not: npm audit
      # exits 1 for both, so the two are told apart by the message, and the
      # outage case is retried once, then reported as a warning rather than a
      # failure. Each attempt is hard-bounded: npm's own fetch retries and
      # five-minute timeouts would otherwise let a hanging endpoint stall the
      # job for half an hour.
      - name: Audit production dependencies
        shell: bash
        run: |
          for attempt in 1 2; do
            set +e
            output=$(timeout 120 npm audit --omit=dev --audit-level=high --fetch-retries=0 --fetch-timeout=60000 2>&1)
            code=$?
            set -e
            echo "$output"
            if [ "$code" -eq 0 ]; then exit 0; fi
            if [ "$code" -eq 124 ] || echo "$output" | grep -qiE 'audit endpoint returned an error|Service Unavailable|ECONNRESET|ETIMEDOUT|ENOTFOUND|EAI_AGAIN'; then
              echo "::warning::npm audit could not reach the registry (attempt $attempt of 2)"
              sleep 30
              continue
            fi
            exit "$code"
          done
          echo "::warning::npm audit skipped: the advisory endpoint stayed unavailable"

  qa:
    name: Browser end-to-end run
    runs-on: ubuntu-24.04
    env:
      MONGOMS_VERSION: 8.2.6
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Cache the mongod binary used by the QA run
        uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-${{ runner.os }}-${{ env.MONGOMS_VERSION }}

      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium

      # No API key: the AI layer runs in its labelled heuristic mode, so the run
      # is free and deterministic.
      - name: Drive the real UI as two users
        run: npm run qa -- --no-screenshots
        env:
          GEMINI_API_KEY: ''
